name: SlothTidy CI & Copilot Code Review

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax verification
        run: |
          node -c server.js
          node -c public/app.js

  copilot-review:
    name: GitHub Copilot PR Review Automation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Automated AI Safety Check
        run: |
          echo "Verifying no hardcoded cloud API keys or telemetry leaks..."
          ! grep -rn "sk-[a-zA-Z0-9]\{20,\}" .
