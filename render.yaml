services:
  - type: web
    name: slothtidy
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: OLLAMA_HOST
        value: http://127.0.0.1:11434
      - key: SENTRY_DSN
        sync: false
